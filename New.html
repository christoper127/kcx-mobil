<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCX MOBIL - Login</title>
<style>
    * {
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  body {
    background: linear-gradient(135deg, #000 0%, #b30000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .login-box {
    background: #ffffff;
    padding: 30px 25px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(179,0,0,0.3);
    width: 320px;
    border: 2px solid #000000;
  }
  .login-box h1 {
    text-align: center;
    margin-bottom: 5px;
    color: #b30000; /* red */
    font-size: 28px;
    letter-spacing: 2px;
  }
  .login-box h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #000000; /* black */
    font-size: 16px;
    font-weight: normal;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 2px solid #000000; /* black border */
    border-radius: 8px;
    outline: none;
    background: #ffffff;
    transition: 0.2s;
  }
  .login-box input:focus {
    border-color: #b30000; /* red on focus */
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: #b30000; /* red */
    color: #ffffff; /* white text */
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.2s;
  }
  .login-box button:hover {
    background: #000000; /* black on hover */
    color: #ffffff;
  }
  .login-box .extra {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
  }
  .login-box .extra a {
    color: #b30000; /* red links */
    text-decoration: none;
    font-weight: 500;
  }
  .login-box .extra a:hover {
    color: #000000; /* black on hover */
  }
</style>
</head>
<body>

<div class="login-box">
  <h1>KCX MOBIL</h1>
  <h2>Login to your account</h2>
  <form action="/login" method="POST">
    <input type="text" name="username" placeholder="Username or Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Sign In</button>
  </form>
  <div class="extra">
    <a href="#">Forgot Password?</a> | <a href="#">Create Account</a>
  </div>
</div>

</body>
</html>
