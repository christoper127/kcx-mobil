<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="Screenshot.png">

    <title>KCXmobil - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 12px;
        }

        .logo h1 {
            margin-top: 10px;
            font-size: 28px;
        }

        .logo span {
            color: #e50914;
        }

        .signup-box {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.15);
        }

        .signup-box h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #e50914;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #e50914;
            cursor: pointer;
            font-weight: bold;
        }

        .terms {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 15px 0 20px;
            color: #aaa;
            font-size: 13px;
        }

        .terms input {
            width: auto;
            margin-top: 2px;
        }

        .terms a {
            color: #e50914;
            text-decoration: none;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: #e50914;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #b20710;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #999;
            font-size: 14px;
        }

        .login-text a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #aaa;
            text-decoration: none;
        }

        .back a:hover {
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #e50914;
        }
    </style>
</head>

<body>

<div class="signup-container">

    <div class="logo">
        <img src="Screenshot.png" alt="KCXmobil Logo">
        <h1>KCX<span>mobil</span></h1>
    </div>

    <div class="signup-box">

        <h2>Create Account</h2>
        <p class="subtitle">Join KCXmobil today</p>

        <form id="signupForm">

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                        minlength="8"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        Show
                    </button>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </label>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </div>

    </div>

    <div class="back">
        <a href="index.html">← Back to KCXmobil</a>
    </div>

</div>


<script>

function togglePassword() {

    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
    } else {
        password.type = "password";
        button.textContent = "Show";
    }
}


document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const message = document.getElementById("message");

    message.textContent = "Account form submitted for " + name + ".";

});

</script>

</body>
</html>
